name: JobFlow preview quality gate

on:
  push:
    branches: [jobflow-netlify-test]
    paths:
      - 'netlify-preview/**'
      - 'database/**'
      - 'scripts/jobflow-preview-smoke.js'
      - 'scripts/jobflow-auth-flow-test.js'
      - 'scripts/jobflow-preset-consistency-test.js'
      - '.github/workflows/jobflow-preview-check.yml'
      - 'netlify.toml'
  pull_request:
    branches: [main]
    paths:
      - 'netlify-preview/**'
      - 'database/**'
      - 'scripts/jobflow-preview-smoke.js'
      - 'scripts/jobflow-auth-flow-test.js'
      - 'scripts/jobflow-preset-consistency-test.js'
      - '.github/workflows/jobflow-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline scripts and preview routes
        run: node scripts/jobflow-preview-smoke.js
      - name: Simulate unified login, session reuse and password recovery
        run: node scripts/jobflow-auth-flow-test.js
      - name: Check Coastal Clean preset consistency and export parity
        run: node scripts/jobflow-preset-consistency-test.js
