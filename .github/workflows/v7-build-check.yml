name: V7 build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/jobflow-website-loop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scripts
        run: |
          node --check scripts/build-production.js
          node --check scripts/v7-growth-core.js
          node --check scripts/v7-jobflow.js
          node --check scripts/v7-smoke-test.js
      - name: Build production site
        run: node scripts/build-production.js
      - name: Verify V7 output
        run: |
          test -f dist/index.html
          grep -q 'ezy-v7-growth-core' dist/index.html
          grep -q 'ezy-v7-jobflow' dist/index.html
          grep -q 'V7.0 · Growth Loop Beta' dist/index.html
      - name: Install smoke-test browser runtime
        run: npm install --no-save jsdom@25
      - name: Run V7 browser smoke test
        run: node scripts/v7-smoke-test.js
